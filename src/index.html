<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>ComClean - C盘清理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Title Bar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <span class="app-icon">&#x1F9F9;</span>
      <span class="app-title">ComClean</span>
    </div>
    <div class="titlebar-controls">
      <button type="button" class="control-btn theme" id="themeToggle" title="切换深色/浅色模式">&#x1F313;</button>
      <button type="button" class="control-btn minimize" id="minBtn">&#x2500;</button>
      <button type="button" class="control-btn close" id="closeBtn">&#x2715;</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="status-badge" id="statusBadge">&#x1F7E2; 就绪</div>
      <h1 class="header-title" id="headerTitle">C盘一键清理</h1>
      <p class="header-desc" id="headerDesc">安全扫描并清理系统中的垃圾文件，释放磁盘空间</p>
    </div>

    <!-- Admin Warning -->
    <div class="admin-warning hidden" id="adminWarning">
      <div class="admin-warning-icon">&#x1F6E1;&#xFE0F;</div>
      <div class="admin-warning-text">
        <strong>建议以管理员身份运行</strong>
        <span>以管理员身份运行可获得更彻底的清理效果</span>
      </div>
      <button type="button" class="admin-btn" id="adminBtn">重新启动</button>
    </div>

    <!-- Action Button -->
    <div class="action-area">
      <button type="button" class="action-btn" id="actionBtn">
        <div class="btn-ring" id="btnRing"></div>
        <div class="btn-content">
          <span class="btn-icon" id="btnIcon">&#x1F50D;</span>
          <span class="btn-label" id="btnLabel">开始扫描</span>
        </div>
      </button>
    </div>

    <!-- Progress -->
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">正在扫描...</div>
    </div>

    <!-- Category Results -->
    <div class="categories" id="categories"></div>

    <!-- Summary -->
    <div class="summary" id="summary">
      <div class="summary-card">
        <div class="summary-icon">&#x1F4CA;</div>
        <div class="summary-info">
          <div class="summary-label">可释放空间</div>
          <div class="summary-value" id="summaryValue">0 B</div>
        </div>
        <button type="button" class="clean-btn" id="cleanBtn">&#x1F9F9; 一键清理</button>
      </div>
    </div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-card">
        <div class="result-icon">&#x2705;</div>
        <div class="result-info">
          <div class="result-label">已释放空间</div>
          <div class="result-value" id="resultValue">0 B</div>
          <div class="result-sub" id="resultSub">清理完成</div>
        </div>
        <button type="button" class="back-btn" id="backBtn">&#x1F504; 重新扫描</button>
      </div>
      <div class="result-details" id="resultDetails"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
